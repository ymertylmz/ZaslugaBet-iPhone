<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b3d21">

  <title>ZaslugaBet</title>
  <meta name="description" content="2/1 • 1/2 için dokuz formüllü maç radarı">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ZaslugaBet">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    :root {
      --green:#062b18;
      --green2:#0b3d21;
      --yellow:#ffd83d;
    }
    * { box-sizing:border-box; }
    html, body {
      margin:0;
      width:100%;
      height:100%;
      background:var(--green);
      overflow:hidden;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    body {
      padding-top:env(safe-area-inset-top);
      padding-bottom:env(safe-area-inset-bottom);
      background:linear-gradient(180deg,#062b18,#0b3d21);
    }
    .shell {
      position:fixed;
      inset:env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;
      background:#f6faf7;
    }
    iframe {
      width:100%;
      height:100%;
      border:0;
      display:block;
      background:#f6faf7;
    }
    #splash {
      position:fixed;
      inset:0;
      z-index:10;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:16px;
      background:linear-gradient(145deg,#062b18,#0b3d21 60%,#14743d);
      color:white;
      transition:opacity .35s ease, visibility .35s ease;
    }
    #splash.hide {
      opacity:0;
      visibility:hidden;
      pointer-events:none;
    }
    #splash img {
      width:118px;
      height:118px;
      object-fit:contain;
      border-radius:24px;
      background:white;
      padding:8px;
      box-shadow:0 18px 50px rgba(0,0,0,.28);
    }
    #splash h1 {
      margin:0;
      font-size:2rem;
      font-weight:900;
      letter-spacing:-.02em;
    }
    #splash p {
      margin:0;
      color:#dce9df;
      font-size:.95rem;
    }
    .dot {
      width:9px;height:9px;border-radius:50%;
      background:var(--yellow);
      animation:pulse 1s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100%{transform:scale(.75);opacity:.45}
      50%{transform:scale(1.3);opacity:1}
    }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/icon-192.png" alt="ZaslugaBet">
    <h1>ZaslugaBet</h1>
    <p>V4 Radar açılıyor...</p>
    <div class="dot"></div>
  </div>

  <div class="shell">
    <iframe
      id="app"
      src="https://zaslugabet.streamlit.app/?embed=true"
      title="ZaslugaBet"
      allow="clipboard-read; clipboard-write"
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
  </div>

  <script>
    const splash = document.getElementById('splash');
    const app = document.getElementById('app');

    app.addEventListener('load', () => {
      setTimeout(() => splash.classList.add('hide'), 650);
    });

    // PWA service worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
