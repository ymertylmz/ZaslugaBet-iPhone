<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ZaslugaBet</title>

<meta name="theme-color" content="#0b3d21">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ZaslugaBet">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">

<link rel="manifest" href="/ZaslugaBet-iPhone/manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="/ZaslugaBet-iPhone/icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/ZaslugaBet-iPhone/icons/icon-192.png">

<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#062b18;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#wrap{position:fixed;inset:env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;background:#f6faf7}
iframe{width:100%;height:100%;border:0;display:block;background:#f6faf7}
#splash{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:linear-gradient(145deg,#062b18,#0b3d21 60%,#14743d);color:white;transition:opacity .3s ease}
#splash.hide{opacity:0;pointer-events:none}
#splash img{width:118px;height:118px;object-fit:contain;border-radius:24px;background:white;padding:8px;box-shadow:0 18px 50px rgba(0,0,0,.28)}
#splash h1{margin:0;font-size:2rem;font-weight:900}
#splash p{margin:0;color:#dce9df}
.dot{width:9px;height:9px;border-radius:50%;background:#ffd83d;animation:p 1s ease-in-out infinite}
@keyframes p{0%,100%{transform:scale(.75);opacity:.45}50%{transform:scale(1.3);opacity:1}}
</style>
</head>
<body>
<div id="splash">
  <img src="/ZaslugaBet-iPhone/icons/icon-192.png" alt="ZaslugaBet">
  <h1>ZaslugaBet</h1>
  <p>V4 Radar açılıyor...</p>
  <div class="dot"></div>
</div>

<div id="wrap">
  <iframe id="app"
    src="https://zaslugabet.streamlit.app/?embed=true"
    title="ZaslugaBet"
    allow="clipboard-read; clipboard-write">
  </iframe>
</div>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/ZaslugaBet-iPhone/sw.js', {scope:'/ZaslugaBet-iPhone/'})
      .catch(()=>{});
  });
}
const splash=document.getElementById('splash');
document.getElementById('app').addEventListener('load',()=>setTimeout(()=>splash.classList.add('hide'),500));
</script>
</body>
</html>
